<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETAR Rendszer - Generikus Kezelési Admin</title>
    <link rel="icon" type="image/png" href="images/ETAR_H.png">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b1528, #020710);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .navbar {
            background-color: rgba(15, 23, 42, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1e293b;
        }
        .card {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(5px);
            border: 1px solid #334155;
            color: #f1f5f9;
        }
        .card-header {
            background-color: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid #334155;
        }
        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #ffffff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            border-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
        }
        .form-control::placeholder {
            color: #94a3b8;
        }
        .btn-primary {
            background-color: #2563eb;
            border: none;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .btn-secondary {
            background-color: #475569;
            border: none;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }
        .btn-success {
            background-color: #10b981;
            border: none;
        }
        .btn-success:hover {
            background-color: #059669;
        }
        .table {
            color: #f1f5f9 !important;
            background-color: transparent !important;
            border-color: #334155 !important;
        }
        .table th, .table td {
            background-color: transparent !important;
            color: #e2e8f0 !important;
            border-bottom-color: #334155 !important;
        }
        .table-striped tbody tr:nth-of-type(odd) td {
            background-color: rgba(51, 65, 85, 0.15) !important;
        }
        .table-hover tbody tr:hover td {
            background-color: rgba(51, 65, 85, 0.3) !important;
            color: #ffffff !important;
        }
        .description-badge {
            background-color: #1e293b;
            border: 1px solid #3b82f6;
            color: #3b82f6;
            margin: 2px;
            display: inline-block;
            padding: 0.25em 0.6em;
            font-size: 0.75em;
            font-weight: 700;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            vertical-align: baseline;
            border-radius: 0.375rem;
        }
        .selected-tag {
            background-color: #1e3a8a;
            color: #93c5fd;
            border: 1px solid #2563eb;
            border-radius: 4px;
            padding: 2px 8px;
            margin: 4px;
            display: inline-flex;
            align-items: center;
            font-size: 0.85rem;
        }
        .selected-tag i {
            cursor: pointer;
            margin-left: 6px;
        }
        .selected-tag i:hover {
            color: #f87171;
        }
        .megnevezes-list-container {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 10px;
            background-color: #0f172a;
        }
        .megnevezes-item {
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .megnevezes-item:hover {
            background-color: rgba(59, 130, 246, 0.2);
        }
        .modal-content {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f1f5f9;
        }
        .modal-header {
            border-bottom: 1px solid #334155;
        }
        .modal-footer {
            border-top: 1px solid #334155;
        }
        /* Custom scrollbar for megnevezes list */
        .megnevezes-list-container::-webkit-scrollbar {
            width: 8px;
        }
        .megnevezes-list-container::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .megnevezes-list-container::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .megnevezes-list-container::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="app.html">
            <img src="images/ETAR_H.png" alt="ETAR Logo" class="h-8 me-2" style="height: 32px;">
            <span class="font-bold">ETAR Generikus Kezelési Admin</span>
        </a>
        <div class="d-flex text-white align-items-center">
            <span id="userEmail" class="me-3 text-muted"></span>
            <button id="logoutBtn" class="btn btn-outline-light btn-sm">Kijelentkezés</button>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-file-code text-primary me-2"></i>Generikus Kezelési Útmutatók</h2>
        <div>
            <a href="app.html" class="btn btn-secondary me-2"><i class="fas fa-arrow-left me-1"></i>Vissza az appba</a>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#editModal" onclick="prepareAdd()">
                <i class="fas fa-plus me-1"></i>Új Útmutató Feltöltése
            </button>
        </div>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer"></div>

    <!-- Manuals List Card -->
    <div class="card shadow">
        <div class="card-header d-flex justify-content-between align-items-center py-3">
            <h5 class="mb-0"><i class="fas fa-list me-2 text-info"></i>Feltöltött kezelési útmutatók</h5>
            <div class="w-25">
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Keresés...">
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 25%">Útmutató Címe</th>
                            <th style="width: 25%">Fájlnév</th>
                            <th style="width: 35%">Társított Megnevezések</th>
                            <th style="width: 15%" class="text-end pe-4">Műveletek</th>
                        </tr>
                    </thead>
                    <tbody id="manualsList">
                        <!-- Content injected via JS -->
                        <tr>
                            <td colspan="4" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Betöltés...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Upload/Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="modalTitle">Útmutató Feltöltése</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Bezárás"></button>
            </div>
            <div class="modal-body">
                <form id="manualForm">
                    <input type="hidden" id="editId">
                    
                    <div class="mb-3">
                        <label class="form-label font-medium">Útmutató megnevezése / Címe</label>
                        <input type="text" class="form-control" id="editTitle" required placeholder="Pl. Hevederek generikus kezelési útmutatója">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label font-medium">HTML Fájl kiválasztása</label>
                        <input class="form-control" type="file" id="htmlUpload" accept=".html" required>
                        <div class="form-text text-muted">Csak .html formátumú fájl tölthető fel!</div>
                        <div id="currentFileLink" class="mt-2"></div>
                    </div>

                    <h6 class="border-b pb-2 mb-3"><i class="fas fa-tags text-primary me-2"></i>Megnevezések társítása</h6>
                    
                    <!-- Selected Tags Container -->
                    <div class="mb-3">
                        <label class="form-label text-muted d-block">Kijelölt megnevezések:</label>
                        <div id="selectedTags" class="d-flex flex-wrap p-2 border border-secondary rounded min-h-[40px]" style="background-color: #0f172a; min-height: 45px;">
                            <span class="text-muted fs-7 p-1 italic" id="noTagsPlaceholder">Nincs kijelölt megnevezés.</span>
                        </div>
                    </div>

                    <!-- Search and Selector List -->
                    <div class="mb-3">
                        <label class="form-label">Megnevezések keresése és kijelölése</label>
                        <input type="text" id="selectorSearch" class="form-control mb-2" placeholder="Írj ide a szűréshez...">
                        
                        <div class="megnevezes-list-container" id="megnevezesListContainer">
                            <!-- Injected checkboxes via JS -->
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Mégse</button>
                <button type="button" class="btn btn-primary" onclick="saveManual()">Mentés</button>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>

<!-- App Logic -->
<script type="module" src="js/generic_handlings_admin.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
